name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Limit debug info to avoid evicting other platform caches.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan CI scope
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      head: ${{ steps.classify.outputs.head }}
      desktop: ${{ steps.scope.outputs.desktop }}
      host_full: ${{ steps.scope.outputs.host_full }}
      build: ${{ steps.scope.outputs.build }}
      clippy: ${{ steps.scope.outputs.clippy }}
      test: ${{ steps.scope.outputs.test }}
      dependencies: ${{ steps.scope.outputs.dependencies }}
      ios: ${{ steps.scope.outputs.ios }}
      android: ${{ steps.scope.outputs.android }}
      web: ${{ steps.scope.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Classify repository changes
        id: classify
        run: |
          python3 .github/scripts/ci_scope.py classify \
            --event "$GITHUB_EVENT_PATH" \
            --github-output "$GITHUB_OUTPUT"

      - name: Cache Cargo data used by target planning
        if: steps.classify.outputs.skip != 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
          key: ci-plan-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ci-plan-${{ runner.os }}-

      - name: Plan affected Cargo work
        id: rail
        if: steps.classify.outputs.skip != 'true'
        uses: loadingalias/cargo-rail-action@78ad385a85627484a5b634cf1bc3caa1de872c6a # v8.2.0
        with:
          version: 0.25.0
          since: ${{ steps.classify.outputs.base }}
          all: ${{ steps.classify.outputs.base == '' }}

      - name: Bind the plan to the exact commit pair
        id: exact
        if: steps.classify.outputs.skip != 'true'
        env:
          BASE: ${{ steps.classify.outputs.base }}
          HEAD_COMMIT: ${{ steps.classify.outputs.head }}
          ACTION_PLAN: ${{ steps.rail.outputs.plan-file }}
          PLAN_READER: ${{ steps.rail.outputs.plan-reader }}
          PLAN_DIR: ${{ runner.temp }}/ci-plan
        run: |
          mkdir "$PLAN_DIR"
          cp "$PLAN_READER" "$PLAN_DIR/read.py"
          if [[ -n "$BASE" ]]; then
            cargo rail plan --json --from "$BASE" --to "$HEAD_COMMIT" > "$PLAN_DIR/plan.json"
          else
            cp "$ACTION_PLAN" "$PLAN_DIR/plan.json"
          fi
          required_work="$(python3 "$PLAN_DIR/read.py" required "$PLAN_DIR/plan.json")"
          echo "required_work=$required_work" >> "$GITHUB_OUTPUT"

      - name: Test scope policy
        if: steps.classify.outputs.skip != 'true'
        run: python3 .github/scripts/test_ci_scope.py

      - name: Finalize required checks
        id: scope
        env:
          REQUIRED_WORK: ${{ steps.exact.outputs.required_work }}
        run: |
          python3 .github/scripts/ci_scope.py finalize \
            --from-ref "${{ steps.classify.outputs.base }}" \
            --to-ref "${{ steps.classify.outputs.head }}" \
            --skip "${{ steps.classify.outputs.skip }}" \
            --full "${{ steps.classify.outputs.full }}" \
            --dependencies "${{ steps.classify.outputs.dependencies }}" \
            --required-work "$REQUIRED_WORK" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload validated plan
        if: steps.classify.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan
          retention-days: 1

  dependencies:
    name: Dependency hygiene
    needs: plan
    if: >-
      always() &&
      (needs.plan.result != 'success' || needs.plan.outputs.dependencies == 'true')
    runs-on: ubuntu-24.04
    steps:
      - name: Fail when CI scope planning failed
        if: needs.plan.result != 'success'
        run: |
          echo 'CI scope planning failed; refusing to skip a required check.' >&2
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.head }}

      - name: Install cargo-machete
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2
        with:
          tool: cargo-machete@0.9.2

      - name: Check unused dependencies
        run: cargo machete

  macos:
    name: macOS arm64
    needs: plan
    if: >-
      always() &&
      (needs.plan.result != 'success' || needs.plan.outputs.desktop == 'true')
    runs-on: macos-26
    steps:
      - name: Fail when CI scope planning failed
        if: needs.plan.result != 'success'
        run: |
          echo 'CI scope planning failed; refusing to skip a required check.' >&2
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.head }}

      - uses: ./.github/actions/desktop-check
        with:
          artifact: ci-plan
          host-full: ${{ needs.plan.outputs.host_full }}
          build: ${{ needs.plan.outputs.build }}
          clippy: ${{ needs.plan.outputs.clippy }}
          test: ${{ needs.plan.outputs.test }}

  linux:
    name: Linux x64
    needs: plan
    if: >-
      always() &&
      (needs.plan.result != 'success' || needs.plan.outputs.desktop == 'true')
    runs-on: ubuntu-24.04
    steps:
      - name: Fail when CI scope planning failed
        if: needs.plan.result != 'success'
        run: |
          echo 'CI scope planning failed; refusing to skip a required check.' >&2
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.head }}

      - uses: ./.github/actions/desktop-check
        with:
          artifact: ci-plan
          host-full: ${{ needs.plan.outputs.host_full }}
          build: ${{ needs.plan.outputs.build }}
          clippy: ${{ needs.plan.outputs.clippy }}
          test: ${{ needs.plan.outputs.test }}

  windows:
    name: Windows x64
    needs: plan
    if: >-
      always() &&
      (needs.plan.result != 'success' || needs.plan.outputs.desktop == 'true')
    runs-on: windows-2022
    steps:
      - name: Fail when CI scope planning failed
        if: needs.plan.result != 'success'
        shell: bash
        run: |
          echo 'CI scope planning failed; refusing to skip a required check.' >&2
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.head }}

      - uses: ./.github/actions/desktop-check
        with:
          artifact: ci-plan
          host-full: ${{ needs.plan.outputs.host_full }}
          build: ${{ needs.plan.outputs.build }}
          clippy: ${{ needs.plan.outputs.clippy }}
          test: ${{ needs.plan.outputs.test }}

  mobile-check:
    name: Mobile and web checks
    needs: plan
    if: >-
      always() &&
      (needs.plan.result != 'success' ||
       needs.plan.outputs.ios == 'true' ||
       needs.plan.outputs.android == 'true' ||
       needs.plan.outputs.web == 'true')
    runs-on: macos-26
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_NDK_PLATFORM: 26
      RUSTFLAGS: -D warnings
    steps:
      - name: Fail when CI scope planning failed
        if: needs.plan.result != 'success'
        run: |
          echo 'CI scope planning failed; refusing to skip a required check.' >&2
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.head }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add iOS Rust target
        if: needs.plan.outputs.ios == 'true'
        run: rustup target add aarch64-apple-ios-sim

      - name: Add Android Rust target
        if: needs.plan.outputs.android == 'true'
        run: rustup target add aarch64-linux-android

      - name: Add Web Rust target
        if: needs.plan.outputs.web == 'true'
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-mobile-${{ runner.os }}-${{ runner.arch }}

      - name: Set up JDK 21
        if: needs.plan.outputs.android == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        if: needs.plan.outputs.android == 'true'
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and cargo-ndk
        if: needs.plan.outputs.android == 'true'
        run: |
          sdkmanager 'ndk;27.1.12297006'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked

      - name: Report Android toolchain
        if: needs.plan.outputs.android == 'true'
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          test -d "$ANDROID_NDK_HOME"
          cargo ndk --version

      - name: Check iOS crate
        if: needs.plan.outputs.ios == 'true'
        run: IPHONEOS_DEPLOYMENT_TARGET=26.0 cargo check -p tcode-ios --target aarch64-apple-ios-sim --locked

      - name: Check Web crate
        if: needs.plan.outputs.web == 'true'
        run: cargo check -p tcode-web --target wasm32-unknown-unknown --locked

      - name: Check Android crate
        if: needs.plan.outputs.android == 'true'
        run: cargo ndk -t arm64-v8a check -p tcode-android --locked
