name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded pull request pushes are cancelled; every push to main runs to
# completion so the branch always has a verified status.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # No debug info in CI test builds: smaller target directory, smaller cache.
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: 1

jobs:
  desktop-work:
    name: ${{ matrix.name }} / ${{ matrix.task }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        task: [clippy, tests]
        platform: [linux, macos, windows]
        include:
          - platform: linux
            name: Linux x64
            os: ubuntu-24.04
          - platform: macos
            name: macOS arm64
            os: macos-26
          - platform: windows
            name: Windows x64
            os: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Disable Windows Defender real-time scanning
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Check-mode artifacts differ from test builds. Keep each main job's
      # cache separate so parallel saves cannot discard the other mode.
      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ runner.os }}-${{ runner.arch }}${{ matrix.task == 'clippy' && '-clippy' || '' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        if: matrix.task == 'tests' && runner.os != 'Windows'
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # Work around install-action's Windows bash startup failure (actions/partner-runner-images#169).
      - name: Install cargo-nextest on Windows
        if: matrix.task == 'tests' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'nextest.zip'
          Invoke-WebRequest -Uri https://get.nexte.st/latest/windows -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath "$env:USERPROFILE\.cargo\bin" -Force
          cargo nextest --version

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          # The Azure mirror has delivered packages at ~65 kB/s on these runners.
          for source in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [[ -f "$source" ]]; then
              sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          apt_get=(sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3)
          "${apt_get[@]}" update
          "${apt_get[@]}" install -y --no-install-recommends \
            build-essential clang cmake pkg-config libssl-dev libzstd-dev \
            libasound2-dev libfontconfig-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libgbm-dev \
            libvulkan-dev xvfb

      - name: Set nextest test concurrency
        if: matrix.task == 'tests'
        shell: python
        run: |
          import os
          test_threads = os.cpu_count()
          if os.environ["RUNNER_OS"] != "Windows":
              test_threads *= 2
          print(f"nextest test threads: {test_threads}")
          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              env_file.write(f"NEXTEST_TEST_THREADS={test_threads}\n")

      - name: Check formatting
        if: matrix.task == 'clippy'
        run: cargo fmt --all --check

      - name: Run Clippy
        if: matrix.task == 'clippy'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        if: matrix.task == 'tests' && runner.os == 'macOS'
        run: cargo nextest run --workspace --locked --profile ci

      - name: Trace Windows test Git processes
        if: matrix.task == 'tests' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $trace = Join-Path $env:RUNNER_TEMP 'nextest-git-trace'
          New-Item -ItemType Directory -Force $trace | Out-Null
          (Get-Command git).Source | Set-Content (Join-Path $trace 'git-install.txt')
          git version --build-options | Add-Content (Join-Path $trace 'git-install.txt')
          git --exec-path | Add-Content (Join-Path $trace 'git-install.txt')
          $env:GIT_TRACE2_EVENT = $trace
          $env:GIT_TRACE2_ENV_VARS = 'NEXTEST_TEST_NAME,NEXTEST_BINARY_ID,NEXTEST_ATTEMPT_ID'
          $env:GIT_TRACE2_CONFIG_PARAMS = 'core.fsmonitor,maintenance.auto'
          cargo nextest run --workspace --locked --profile ci --no-fail-fast

      - name: Upload Windows process trace
        if: always() && matrix.task == 'tests' && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-git-trace
          path: |
            ${{ runner.temp }}/nextest-git-trace
            target/nextest/ci/junit.xml
          retention-days: 7

      - name: Test iOS text input on the host
        if: matrix.task == 'tests' && runner.os == 'macOS'
        run: cargo test -p gpui-ios --lib --locked

      - name: Run tests under Xvfb
        if: matrix.task == 'tests' && runner.os == 'Linux'
        run: xvfb-run -a cargo nextest run --workspace --locked --profile ci

  # Preserve the existing required check names. A skipped or cancelled worker
  # must not let any desktop gate pass.
  desktop:
    name: ${{ matrix.name }}
    needs: desktop-work
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        name: [Linux x64, macOS arm64, Windows x64]
    steps:
      - name: Require all desktop checks
        env:
          RESULT: ${{ needs.desktop-work.result }}
        run: test "$RESULT" = success

  dependencies:
    name: Dependency hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: Check unused dependencies
        run: cargo machete

  ios:
    name: iOS
    runs-on: macos-26
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
      IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-ios
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check iOS crate
        run: cargo check -p tcode-ios --target aarch64-apple-ios-sim --locked

  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
      CARGO_NDK_PLATFORM: 26
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-android
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The legacy `tools` package (the action's default) no longer exists.
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager 'ndk;27.1.12297006'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: cargo-ndk

      - name: Check Android crate
        run: cargo ndk -t arm64-v8a check -p tcode-android --locked

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-web
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check Web crate
        run: cargo check -p tcode-web --target wasm32-unknown-unknown --locked
