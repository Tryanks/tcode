name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-26
          - name: Linux x64
            os: ubuntu-24.04
          - name: Windows x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      # Smaller target/ keeps the per-repo 10 GB Actions cache pool under its
      # limit; full debug info was evicting the Windows/Linux/release caches.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      RUST_BACKTRACE: 1
      TCODE_LIVE_TESTS: 0

    steps:
      - uses: actions/checkout@v7

      - name: Disable Windows Defender real-time scanning
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ runner.os }}-${{ runner.arch }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config libssl-dev libzstd-dev mold \
            libasound2-dev libfontconfig-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libgbm-dev \
            libvulkan-dev xvfb
          # The current tree enables preview/webview transitively. X2 is expected
          # to disable it on Linux, at which point this conditional becomes false.
          if cargo tree -e normal -i glib-sys >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends \
              libgtk-3-dev libwebkit2gtk-4.1-dev
          fi

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run workspace tests (Linux under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --workspace --locked

      - name: Run workspace tests
        if: runner.os != 'Linux'
        run: cargo test --workspace --locked

  client-app:
    name: Shared client
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: line-tables-only

    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config libssl-dev

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2
        with:
          # client-app is intentionally excluded from the root workspace, so
          # its build data lives under its own manifest directory.
          workspaces: crates/client-app -> target
          shared-key: multiplatform-client-host

      - name: Run shared client tests
        run: cargo test --manifest-path crates/client-app/Cargo.toml --locked

      - name: Lint the shared client
        run: cargo clippy --manifest-path crates/client-app/Cargo.toml --locked -- -D warnings

  wasm:
    name: Web targets
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # GPUI's web dispatcher assumes wasm threads and shared memory, which
      # require both a rebuilt standard library and these target features.
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: "-C target-feature=+atomics,+bulk-memory,+mutable-globals"
      RUSTC_BOOTSTRAP: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Install nightly Rust for wasm
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: wasm32-unknown-unknown

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config libssl-dev

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2
        with:
          # The excluded client manifest and root web crate use separate target
          # directories even though they compile for the same platform.
          workspaces: |
            . -> target
            crates/client-app -> target
          shared-key: multiplatform-wasm32-unknown-unknown

      - name: Check the shared client for wasm
        run: cargo check --manifest-path crates/client-app/Cargo.toml --target wasm32-unknown-unknown --locked

      - name: Check the browser shell
        run: cargo +nightly -Zbuild-std=std,panic_abort check -p tcode-web --target wasm32-unknown-unknown --locked

  ios:
    name: iOS targets
    runs-on: macos-15
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: line-tables-only

    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust for iOS
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: multiplatform-aarch64-apple-ios

      - name: Check the iOS backends
        run: cargo check -p gpui-ios -p tcode-ios --target aarch64-apple-ios --locked

  android:
    name: Android targets
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: line-tables-only

    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config libssl-dev

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: multiplatform-aarch64-linux-android

      - name: Configure the Android NDK
        run: |
          # psm assembles AArch64 while Cargo checks GPUI, so host Clang cannot
          # stand in for the Android API 26 toolchain verified by this project.
          toolchain="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$toolchain/aarch64-linux-android26-clang"
          test -x "$toolchain/llvm-ar"
          echo "CC_aarch64_linux_android=$toolchain/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$toolchain/llvm-ar" >> "$GITHUB_ENV"

      - name: Check the Android backends
        run: cargo check -p gpui-android -p tcode-android --target aarch64-linux-android --locked
