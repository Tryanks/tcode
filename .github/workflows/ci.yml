name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Pull requests opened with GITHUB_TOKEN start no pull_request run; the
  # agent-version workflow dispatches one instead.
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull request pushes are cancelled; every push to main runs to
# completion so the branch always has a verified status.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # No debug info in CI test builds: smaller target directory, smaller cache.
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: 1

jobs:
  # Not a matrix: a job can only wait for a whole matrix, and each platform's
  # required check must wait for that platform's Clippy and tests alone.
  linux-clippy:
    name: Linux x64 / clippy
    if: github.head_ref != 'ui-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps: &clippy-steps
      - &checkout
        uses: actions/checkout@v7

      - &disable-defender
        name: Disable Windows Defender real-time scanning
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - &install-rust
        name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Clippy restores the test jobs' cache but never saves its own: it already
      # finishes before the tests, and a second cache per platform would overflow
      # the repository's Actions cache quota and evict the test caches.
      - name: Restore Cargo build data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ runner.os }}-${{ runner.arch }}
          save-if: false

      - &install-linux-dependencies
        name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          # The Azure mirror has delivered packages at ~65 kB/s on these runners.
          for source in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [[ -f "$source" ]]; then
              sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          apt_get=(sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3)
          "${apt_get[@]}" update
          "${apt_get[@]}" install -y --no-install-recommends \
            build-essential clang cmake pkg-config libssl-dev libzstd-dev \
            libasound2-dev libfontconfig-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libgbm-dev \
            libvulkan-dev libwebkit2gtk-4.1-dev libgtk-3-dev xvfb

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The container image runs tcode-headless with the browser bundle built
      # in. Release publishing builds both with fat LTO and smoke-tests the
      # images; here the bundle only has to build and the binary pass Clippy.
      - name: Read the locked wasm-bindgen version
        id: wasm-bindgen
        if: runner.os == 'Linux'
        run: echo "version=$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"$/\1/p;q;}' Cargo.lock)" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}

      - name: Build the browser bundle
        if: runner.os == 'Linux'
        env:
          CARGO_PROFILE_RELEASE_LTO: 'off'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '256'
          CARGO_PROFILE_RELEASE_OPT_LEVEL: '0'
        run: |
          rustup target add wasm32-unknown-unknown
          crates/web/build.sh

      - name: Run Clippy on the container's headless host
        if: runner.os == 'Linux'
        run: cargo clippy -p tcode-headless --features web --all-targets --locked -- -D warnings

      - uses: actions/setup-node@v7
        if: runner.os == 'Linux'
        with:
          node-version: '24'

      - name: Check the container scripts and Compose files
        if: runner.os == 'Linux'
        run: |
          shellcheck crates/headless/container/*.sh
          for script in crates/headless/container/*.mjs; do node --check "$script"; done
          TCODE_PASSWORD=ci docker compose config --quiet
          docker compose -f crates/traverse-server/docker-compose.yml config --quiet

  linux-tests:
    name: Linux x64 / tests
    if: github.head_ref != 'ui-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps: &test-steps
      - *checkout
      - *disable-defender
      - *install-rust

      # Only main writes the cache so pull requests share one warm copy per
      # platform instead of evicting each other from the repository quota.
      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        if: runner.os != 'Windows'
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # Work around install-action's Windows bash startup failure (actions/partner-runner-images#169).
      - name: Install cargo-nextest on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'nextest.zip'
          Invoke-WebRequest -Uri https://get.nexte.st/latest/windows -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath "$env:USERPROFILE\.cargo\bin" -Force
          cargo nextest --version

      - *install-linux-dependencies

      # Two slots per CPU: most tests wait on child processes rather than compute.
      - name: Set nextest test concurrency
        shell: python
        run: |
          import os
          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              env_file.write(f"NEXTEST_TEST_THREADS={os.cpu_count() * 2}\n")

      - name: Run tests
        if: runner.os != 'Linux'
        run: cargo nextest run --workspace --locked --no-fail-fast

      - name: Test iOS text input on the host
        if: runner.os == 'macOS'
        run: cargo test -p gpui-ios --lib --locked

      - name: Run tests under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo nextest run --workspace --locked --no-fail-fast

  macos-clippy:
    name: macOS arm64 / clippy
    if: github.head_ref != 'ui-v2'
    runs-on: macos-26
    timeout-minutes: 60
    steps: *clippy-steps

  macos-tests:
    name: macOS arm64 / tests
    if: github.head_ref != 'ui-v2'
    runs-on: macos-26
    timeout-minutes: 60
    steps: *test-steps

  windows-clippy:
    name: Windows x64 / clippy
    if: github.head_ref != 'ui-v2'
    runs-on: windows-2022
    timeout-minutes: 60
    steps: *clippy-steps

  windows-tests:
    name: Windows x64 / tests
    if: github.head_ref != 'ui-v2'
    runs-on: windows-2022
    timeout-minutes: 60
    steps: *test-steps

  # The required checks keep their platform names. A skipped or cancelled job
  # must not let its platform's check pass.
  linux:
    name: Linux x64
    if: github.head_ref != 'ui-v2'
    needs: [linux-clippy, linux-tests]
    if: always() && github.head_ref != 'ui-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps: &require-platform
      - name: Require the platform's Clippy and tests
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: test "$RESULTS" = "success success"

  macos:
    name: macOS arm64
    if: github.head_ref != 'ui-v2'
    needs: [macos-clippy, macos-tests]
    if: always() && github.head_ref != 'ui-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps: *require-platform

  windows:
    name: Windows x64
    if: github.head_ref != 'ui-v2'
    needs: [windows-clippy, windows-tests]
    if: always() && github.head_ref != 'ui-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps: *require-platform

  dependencies:
    name: Dependency hygiene
    if: github.head_ref != 'ui-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: Check unused dependencies
        run: cargo machete

  ios:
    name: iOS
    if: github.head_ref != 'ui-v2'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-ios
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check iOS crate
        run: cargo check -p tcode-ios --target aarch64-apple-ios-sim --locked

  android:
    name: Android
    if: github.head_ref != 'ui-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
      CARGO_NDK_PLATFORM: 26
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-android
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The legacy `tools` package (the action's default) no longer exists.
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager 'ndk;27.1.12297006'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: cargo-ndk

      - name: Check Android crate
        run: cargo ndk -t arm64-v8a check -p tcode-android --locked

  web:
    name: Web
    if: github.head_ref != 'ui-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-web
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check Web crate
        run: cargo check -p tcode-web --target wasm32-unknown-unknown --locked
