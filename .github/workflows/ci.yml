name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded pull request pushes are cancelled; every push to main runs to
# completion so the branch always has a verified status.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # No debug info in CI test builds: smaller target directory, smaller cache.
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: 1

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: macOS arm64
            os: macos-26
          - name: Windows x64
            os: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Disable Windows Defender real-time scanning
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Only main writes the cache so pull requests share one warm copy per
      # platform instead of evicting each other from the repository quota.
      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          apt_get=(sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3)
          "${apt_get[@]}" update
          "${apt_get[@]}" install -y --no-install-recommends \
            build-essential clang cmake pkg-config libssl-dev libzstd-dev \
            libasound2-dev libfontconfig-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libgbm-dev \
            libvulkan-dev xvfb
          if cargo tree -e normal -i glib-sys >/dev/null 2>&1; then
            "${apt_get[@]}" install -y --no-install-recommends \
              libgtk-3-dev libwebkit2gtk-4.1-dev
          fi

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        if: runner.os != 'Linux'
        run: cargo nextest run --workspace --locked

      - name: Run tests under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo nextest run --workspace --locked

  dependencies:
    name: Dependency hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: Check unused dependencies
        run: cargo machete

  ios:
    name: iOS
    runs-on: macos-26
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
      IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-ios
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check iOS crate
        run: cargo check -p tcode-ios --target aarch64-apple-ios-sim --locked

  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
      CARGO_NDK_PLATFORM: 26
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-android
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The legacy `tools` package (the action's default) no longer exists.
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager 'ndk;27.1.12297006'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: cargo-ndk

      - name: Check Android crate
        run: cargo ndk -t arm64-v8a check -p tcode-android --locked

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-web
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check Web crate
        run: cargo check -p tcode-web --target wasm32-unknown-unknown --locked
