name: Containers

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: Container smoke ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: containers-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake pkg-config libssl-dev libzstd-dev binaryen
          cargo install wasm-bindgen-cli --version 0.2.121 --locked
      - name: Build browser and host binaries
        run: |
          bash .github/scripts/build-web.sh
          cargo build -p tcode-headless --features web --locked
          cargo build -p tcode-traverse-server --locked
          cargo build -p tcode-traverse --example pair_and_query --locked
          mkdir -p dist/${{ matrix.arch }}
          cp target/debug/tcode-headless target/debug/tcode-traverse dist/${{ matrix.arch }}/
      - uses: docker/setup-buildx-action@v4
      - name: Build and exercise deployment images
        run: |
          set -euo pipefail
          TCODE_PASSWORD=compose-smoke docker compose config --quiet
          docker buildx build --load --target slim -f crates/headless/Dockerfile -t tcode-headless:slim-test .
          docker buildx build --load --target full -f crates/headless/Dockerfile -t tcode-headless:full-test .
          docker buildx build --load --build-arg BINARY_SOURCE=release -f crates/traverse-server/Dockerfile -t tcode-traverse:test .
          node crates/headless/container/smoke.mjs tcode-headless:full-test tcode-headless:slim-test \
            "$PWD/target/debug/examples/pair_and_query" tcode-traverse:test
