name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Tag-scoped Cargo caches cannot warm the next release and evict the main CI
# caches from the shared Actions quota.
jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_TAG}"
          case "$tag" in v*) ;; *) echo "Tag must start with v: $tag" >&2; exit 1;; esac
          version="${tag#v}"
          prerelease=false
          case "$version" in *-*) prerelease=true;; esac
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  package:
    name: ${{ matrix.label }}
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-26
            target: aarch64-apple-darwin
            platform: macos
            arch: arm64
          - label: macOS x64
            os: macos-26
            target: x86_64-apple-darwin
            platform: macos
            arch: x64
          - label: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x64
          - label: Windows arm64
            os: windows-2022
            target: aarch64-pc-windows-msvc
            platform: windows
            arch: arm64
          - label: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
          - label: Linux arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_STRIP: symbols
      VERSION: ${{ needs.setup.outputs.version }}
      TCODE_BUILD_VERSION: ${{ needs.setup.outputs.version }}
      RELEASE_TAG: ${{ needs.setup.outputs.tag }}
      PRERELEASE: ${{ needs.setup.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.tag }}

      - name: Install stable Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          apt_get=(sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3)
          "${apt_get[@]}" update
          "${apt_get[@]}" install -y --no-install-recommends \
            build-essential clang cmake pkg-config libssl-dev libzstd-dev \
            libasound2-dev libfontconfig-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libgbm-dev libvulkan-dev

      - name: Build release binary
        shell: bash
        run: |
          start=$SECONDS
          cargo build --release --locked --target "${{ matrix.target }}"
          elapsed=$((SECONDS - start))
          echo "### ${{ matrix.label }} build: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble macOS app bundle
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          app="dist/Tcode.app"
          mkdir -p \
            "$app/Contents/MacOS" \
            "$app/Contents/Resources"
          cp "target/${{ matrix.target }}/release/tcode" "$app/Contents/MacOS/tcode"
          cp assets/icons/app/tcode.icns "$app/Contents/Resources/tcode.icns"
          chmod +x "$app/Contents/MacOS/tcode"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>tcode</string>
            <key>CFBundleIconFile</key><string>tcode.icns</string>
            <key>CFBundleIdentifier</key><string>com.tryanks.tcode</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>Tcode</string>
            <key>CFBundleDisplayName</key><string>Tcode</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.developer-tools</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSMicrophoneUsageDescription</key><string>Tcode uses the microphone for voice input in the message composer.</string>
            <key>NSSpeechRecognitionUsageDescription</key><string>Tcode transcribes your speech on-device to type messages by voice.</string>
          </dict></plist>
          PLIST
          plutil -lint "$app/Contents/Info.plist"

      # Signing credentials are optional. With none of the six MACOS_* secrets the
      # build ships unsigned; with all six it is signed, notarized and stapled; a
      # partial set fails this step naming the missing secrets. They come from the
      # maintainer's Apple Developer account (Developer ID Application certificate
      # and a 10-character Team ID):
      #   MACOS_CERTIFICATE          base64 of the Developer ID .p12 exported from
      #                              Keychain Access "My Certificates" (includes the key)
      #   MACOS_CERTIFICATE_PASSWORD password chosen for that .p12 export
      #   MACOS_SIGN_IDENTITY        exact string from `security find-identity -v -p codesigning`
      #   MACOS_NOTARY_APPLE_ID      Apple ID email used for notarization
      #   MACOS_NOTARY_TEAM_ID       the Team ID
      #   MACOS_NOTARY_PASSWORD      an app-specific password from account.apple.com
      # Verify a signed release locally with
      #   spctl -a -vvv -t open --context context:primary-signature tcode-*.dmg
      #   xcrun stapler validate tcode-*.dmg
      #   spctl -a -vvv -t exec /Applications/Tcode.app
      #   xcrun stapler validate /Applications/Tcode.app
      # Windows builds ship unsigned; there is no Sparkle-style updater.
      - name: Sign, notarize, and package macOS
        id: macos_sign
        if: matrix.platform == 'macos'
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          app="dist/Tcode.app"
          zip="dist/tcode-${VERSION}-macos-${{ matrix.arch }}.zip"
          dmg="dist/tcode-${VERSION}-macos-${{ matrix.arch }}.dmg"

          missing=()
          for var in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD MACOS_SIGN_IDENTITY \
                     MACOS_NOTARY_APPLE_ID MACOS_NOTARY_TEAM_ID MACOS_NOTARY_PASSWORD; do
            [[ -n "${!var:-}" ]] || missing+=("$var")
          done
          signed=false
          if (( ${#missing[@]} == 0 )); then
            signed=true
          elif (( ${#missing[@]} < 6 )); then
            echo "::error::macOS signing partially configured; missing: ${missing[*]}" >&2
            exit 1
          else
            echo "::notice::macOS signing secrets not configured — shipping an unsigned build."
          fi

          notarize() {
            local out status id
            out="$(xcrun notarytool submit "$1" \
              --apple-id "$MACOS_NOTARY_APPLE_ID" --team-id "$MACOS_NOTARY_TEAM_ID" \
              --password "$MACOS_NOTARY_PASSWORD" --wait --output-format json)"
            status="$(printf '%s' "$out" | plutil -extract status raw -)"
            id="$(printf '%s' "$out" | plutil -extract id raw -)"
            if [[ "$status" != "Accepted" ]]; then
              echo "::error::notarization $status for $1" >&2
              xcrun notarytool log "$id" --apple-id "$MACOS_NOTARY_APPLE_ID" \
                --team-id "$MACOS_NOTARY_TEAM_ID" --password "$MACOS_NOTARY_PASSWORD" >&2 || true
              exit 1
            fi
          }

          if [[ "$signed" == "true" ]]; then
            # Delete the temporary signing keychain and certificate even if signing fails.
            keychain="$RUNNER_TEMP/tcode-signing.keychain-db"
            cert_path="$RUNNER_TEMP/developer_id.p12"
            trap 'security delete-keychain "$keychain" 2>/dev/null || true; rm -f "$cert_path"' EXIT
            keychain_password="$(openssl rand -base64 24)"
            echo "$MACOS_CERTIFICATE" | base64 --decode > "$cert_path"
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            security import "$cert_path" -P "$MACOS_CERTIFICATE_PASSWORD" \
              -t cert -f pkcs12 -k "$keychain" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple: \
              -k "$keychain_password" "$keychain" >/dev/null
            security list-keychain -d user -s "$keychain" login.keychain-db
            rm -f "$cert_path"

            # Notarization requires the hardened runtime.
            codesign --force --timestamp --options runtime \
              --entitlements assets/macos/tcode.entitlements \
              --sign "$MACOS_SIGN_IDENTITY" "$app"
            codesign --verify --strict --verbose=2 "$app"

            # Notarize + staple the app, so the .zip (built next) carries its ticket.
            notarize_zip="$RUNNER_TEMP/tcode-notarize.zip"
            ditto -c -k --sequesterRsrc --keepParent "$app" "$notarize_zip"
            notarize "$notarize_zip"
            xcrun stapler staple "$app"
            rm -f "$notarize_zip"

            codesign -dv --verbose=4 "$app" 2>&1 | grep -q 'flags=.*runtime' \
              || { echo "::error::hardened runtime flag missing on the app" >&2; exit 1; }
            spctl -a -vvv -t exec "$app"
          fi

          ditto -c -k --sequesterRsrc --keepParent "$app" "$zip"

          mkdir -p dmg-root
          ditto "$app" "dmg-root/Tcode.app"
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname Tcode -srcfolder "$PWD/dmg-root" -ov \
            -fs HFS+ -format UDZO "$PWD/$dmg"

          if [[ "$signed" == "true" ]]; then
            # The DMG needs its own notarization ticket, separate from the app inside.
            codesign --force --timestamp --sign "$MACOS_SIGN_IDENTITY" "$dmg"
            notarize "$dmg"
            xcrun stapler staple "$dmg"
            spctl -a -vvv -t open --context context:primary-signature "$dmg"
            echo "::notice::macOS build signed and notarized (app + DMG)."
          fi

          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          rm -rf "$app" dmg-root

      - name: Package Windows zip
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $stage = "dist\tcode-$env:VERSION-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\tcode.exe" "$stage\tcode.exe"
          @"
          Tcode $env:VERSION

          Microsoft Edge WebView2 Runtime is required (included with Windows 11).
          "@ | Set-Content "$stage\README.txt"
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\tcode-$env:VERSION-windows-${{ matrix.arch }}.zip"
          Remove-Item -Recurse -Force $stage

      - name: Package Linux tarball
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          stage="dist/tcode-${VERSION}-linux-${{ matrix.arch }}"
          mkdir -p \
            "$stage/bin" \
            "$stage/share/applications" \
            "$stage/share/icons/hicolor/1024x1024/apps"
          cp "target/${{ matrix.target }}/release/tcode" "$stage/bin/tcode"
          cp assets/icons/app/tcode.png \
            "$stage/share/icons/hicolor/1024x1024/apps/com.tryanks.tcode.png"
          chmod +x "$stage/bin/tcode"
          cat > "$stage/share/applications/com.tryanks.tcode.desktop" <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=Tcode
          Comment=Desktop coding agent client
          Exec=tcode
          Icon=com.tryanks.tcode
          Terminal=false
          Categories=Development;
          StartupWMClass=tcode
          DESKTOP
          cat > "$stage/README.txt" <<README
          Tcode ${VERSION}

          Install for all users with:
            sudo cp -R bin share /usr/local/

          Runtime requirements include ALSA, Fontconfig, Wayland/X11 libraries,
          libgbm, and a Vulkan loader plus a working Vulkan ICD/graphics driver.
          README
          tar -C dist -czf "dist/tcode-${VERSION}-linux-${{ matrix.arch }}.tar.gz" \
            "tcode-${VERSION}-linux-${{ matrix.arch }}"
          rm -rf "$stage"

      - name: List packaged files
        shell: bash
        run: ls -lh dist

      - name: Create release if needed and publish package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          cat > "$notes_file" <<'NOTES'
          ## Platform notes

          - **macOS 12+**: release builds are Developer ID signed and notarized when the maintainer has configured signing credentials. If you downloaded an unsigned build, clear Gatekeeper quarantine after moving the app to Applications with:

            `xattr -dr com.apple.quarantine /Applications/Tcode.app`

          - **Windows**: Microsoft Edge WebView2 Runtime is required. It is included with Windows 11.
          - **Linux**: requires ALSA, Fontconfig, Wayland/X11 client libraries, libgbm, the Vulkan loader, and a working Vulkan ICD/graphics driver.
          - **Android**: the arm64 APK is signed with the project's release key and installs over previous releases signed with it. A build signed with a different key (a local build, or a release from before the key existed) must be uninstalled first.
          - **iOS**: not published yet.

          Packages are uploaded as soon as each platform build completes. macOS artifacts are
          architecture-specific. Windows MSI/NSIS and Linux AppImage packages are not currently
          produced. `SHA256SUMS.txt` is added after every platform package has finished.
          NOTES

          # macOS runners run bash 3.2, which has no ${var,,}.
          image_repo="$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          {
            printf '\n## Docker (Linux amd64 / arm64)\n\n'
            printf 'Images: `ghcr.io/%s-headless:%s`, `ghcr.io/%s-headless:%s-slim` and `ghcr.io/%s-traverse:%s`.\n\n' \
              "$image_repo" "$VERSION" "$image_repo" "$VERSION" "$image_repo" "$VERSION"
            printf 'Save this as `docker-compose.yml`, set `TCODE_PASSWORD` in `.env`, then run `docker compose up -d`. Set `TCODE_VERSION=%s` in `.env` to pin this release.\n\n' "$VERSION"
            printf 'Container login methods and NAS setup: https://github.com/%s/blob/%s/docs/docker.md\n\n' "$REPOSITORY" "$RELEASE_TAG"
            printf '```yaml\n'
            cat docker-compose.yml
            printf '```\n'
          } >> "$notes_file"

          release_args=(
            "$RELEASE_TAG"
            --repo "$REPOSITORY"
            --verify-tag
            --title "$RELEASE_TAG"
            --generate-notes
            --notes-file "$notes_file"
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          if ! gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            if ! gh release create "${release_args[@]}"; then
              # Another matrix job may have won the create race. Give the API a
              # moment to expose that release, but fail if it never appears.
              for _ in {1..6}; do
                gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1 && break
                sleep 2
              done
              gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null
            fi
          fi

          gh release upload "$RELEASE_TAG" dist/* \
            --repo "$REPOSITORY" \
            --clobber

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  web-bundle:
    name: Build embedded web bundle
    needs: setup
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.tag }}

      - name: Install stable Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm tools
        run: |
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binaryen

      - name: Build browser bundle
        run: crates/web/build.sh

      - name: Upload browser bundle
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: crates/web/dist
          if-no-files-found: error
          retention-days: 1

  package-headless:
    name: Headless ${{ matrix.label }}
    needs: [setup, web-bundle]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-26
            target: aarch64-apple-darwin
            platform: macos
            arch: arm64
          - label: macOS x64
            os: macos-26
            target: x86_64-apple-darwin
            platform: macos
            arch: x64
          - label: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x64
          - label: Windows arm64
            os: windows-2022
            target: aarch64-pc-windows-msvc
            platform: windows
            arch: arm64
          - label: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
          - label: Linux arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_STRIP: symbols
      VERSION: ${{ needs.setup.outputs.version }}
      TCODE_BUILD_VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.tag }}

      - name: Install stable Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config libssl-dev libzstd-dev

      - name: Download browser bundle
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: crates/web/dist

      - name: Build headless server with embedded web client
        shell: bash
        run: cargo build -p tcode-headless --release --locked --features web --target "${{ matrix.target }}"

      - name: Package Unix server
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/tcode-headless" dist/tcode-headless
          chmod +x dist/tcode-headless
          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            (cd dist && zip -q "tcode-headless-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}.zip" tcode-headless)
          else
            tar -C dist -czf "dist/tcode-headless-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" tcode-headless
          fi
          rm dist/tcode-headless

      - name: Package Windows server
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\tcode-headless.exe" "dist\tcode-headless.exe"
          Compress-Archive -Path "dist\tcode-headless.exe" -DestinationPath "dist\tcode-headless-$env:VERSION-windows-${{ matrix.arch }}.zip"
          Remove-Item "dist\tcode-headless.exe"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: package-headless-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  package-traverse:
    name: Traverse ${{ matrix.label }}
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-26
            target: aarch64-apple-darwin
            platform: macos
            arch: arm64
          - label: macOS x64
            os: macos-26
            target: x86_64-apple-darwin
            platform: macos
            arch: x64
          - label: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x64
          - label: Windows arm64
            os: windows-2022
            target: aarch64-pc-windows-msvc
            platform: windows
            arch: arm64
          - label: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
          - label: Linux arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_STRIP: symbols
      VERSION: ${{ needs.setup.outputs.version }}
      TCODE_BUILD_VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.tag }}

      - name: Install stable Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config

      - name: Build Traverse server
        shell: bash
        run: cargo build -p tcode-traverse-server --release --locked --target "${{ matrix.target }}"

      - name: Package Unix server
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/tcode-traverse" dist/tcode-traverse
          chmod +x dist/tcode-traverse
          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            (cd dist && zip -q "tcode-traverse-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}.zip" tcode-traverse)
          else
            tar -C dist -czf "dist/tcode-traverse-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" tcode-traverse
          fi
          rm dist/tcode-traverse

      - name: Package Windows server
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\tcode-traverse.exe" "dist\tcode-traverse.exe"
          Compress-Archive -Path "dist\tcode-traverse.exe" -DestinationPath "dist\tcode-traverse-$env:VERSION-windows-${{ matrix.arch }}.zip"
          Remove-Item "dist\tcode-traverse.exe"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: package-traverse-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  container-images:
    name: Container images ${{ matrix.arch }}
    needs: [setup, package-headless, package-traverse]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            archive_arch: x64
            os: ubuntu-24.04
          - arch: arm64
            archive_arch: arm64
            os: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      ARCH: ${{ matrix.arch }}
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.tag }}

      - uses: actions/download-artifact@v8
        with:
          pattern: package-*-linux-${{ matrix.archive_arch }}
          path: archives
          merge-multiple: true

      - name: Stage release binaries and image names
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "dist/$ARCH"
          for binary in tcode-headless tcode-traverse; do
            tar -xzf "archives/$binary-$VERSION-linux-${{ matrix.archive_arch }}.tar.gz" -C "dist/$ARCH"
          done
          echo "HEADLESS_IMAGE=ghcr.io/${REPOSITORY,,}-headless" >> "$GITHUB_ENV"
          echo "TRAVERSE_IMAGE=ghcr.io/${REPOSITORY,,}-traverse" >> "$GITHUB_ENV"
          echo "REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-container-probe-${{ matrix.arch }}

      - name: Install pairing probe build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake pkg-config libssl-dev libzstd-dev

      - name: Build native container pairing probe
        run: cargo build -p tcode-traverse --example pair_and_query --locked

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build slim image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/headless/Dockerfile
          target: slim
          build-args: BINARY_SOURCE=release
          load: true
          tags: ${{ env.HEADLESS_IMAGE }}:${{ env.VERSION }}-slim-${{ env.ARCH }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ env.REVISION }}
          cache-from: type=gha,scope=headless-${{ matrix.arch }}

      - name: Build full image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/headless/Dockerfile
          target: full
          build-args: BINARY_SOURCE=release
          load: true
          tags: ${{ env.HEADLESS_IMAGE }}:${{ env.VERSION }}-${{ env.ARCH }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ env.REVISION }}
          cache-from: type=gha,scope=headless-${{ matrix.arch }}
          cache-to: type=gha,scope=headless-${{ matrix.arch }},mode=max

      - name: Build Traverse image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/traverse-server/Dockerfile
          build-args: BINARY_SOURCE=release
          load: true
          tags: ${{ env.TRAVERSE_IMAGE }}:${{ env.VERSION }}-${{ env.ARCH }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ env.REVISION }}

      - name: Verify containers before publishing
        run: |
          node crates/headless/container/smoke.mjs \
            "$HEADLESS_IMAGE:$VERSION-$ARCH" "$HEADLESS_IMAGE:$VERSION-slim-$ARCH" \
            "$PWD/target/debug/examples/pair_and_query" "$TRAVERSE_IMAGE:$VERSION-$ARCH"

      - uses: anchore/sbom-action/download-syft@v0.24.3
        id: syft

      - name: Push verified architecture images
        id: push
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          for entry in "headless=$HEADLESS_IMAGE:$VERSION-$ARCH" \
                       "slim=$HEADLESS_IMAGE:$VERSION-slim-$ARCH" \
                       "traverse=$TRAVERSE_IMAGE:$VERSION-$ARCH"; do
            name="${entry%%=*}"
            image="${entry#*=}"
            "$SYFT" scan "docker:$image" --output "spdx-json=$RUNNER_TEMP/$name.spdx.json"
            docker push "$image"
            echo "$name=$(docker inspect --format '{{index .RepoDigests 0}}' "$image" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
          done

      - uses: actions/attest@v4
        with:
          subject-name: ${{ env.HEADLESS_IMAGE }}
          subject-digest: ${{ steps.push.outputs.headless }}
          sbom-path: ${{ runner.temp }}/headless.spdx.json
          push-to-registry: true

      - uses: actions/attest@v4
        with:
          subject-name: ${{ env.HEADLESS_IMAGE }}
          subject-digest: ${{ steps.push.outputs.slim }}
          sbom-path: ${{ runner.temp }}/slim.spdx.json
          push-to-registry: true

      - uses: actions/attest@v4
        with:
          subject-name: ${{ env.TRAVERSE_IMAGE }}
          subject-digest: ${{ steps.push.outputs.traverse }}
          sbom-path: ${{ runner.temp }}/traverse.spdx.json
          push-to-registry: true

  publish-containers:
    name: Publish ${{ matrix.image }}${{ matrix.suffix }}
    needs: [setup, container-images]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - image: headless
            suffix: ''
            alias: latest
          - image: headless
            suffix: -slim
            alias: slim
          - image: traverse
            suffix: ''
            alias: latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the version tag and stable alias
        id: manifest
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.setup.outputs.version }}
          PRERELEASE: ${{ needs.setup.outputs.prerelease }}
          SUFFIX: ${{ matrix.suffix }}
          ALIAS: ${{ matrix.alias }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}-${{ matrix.image }}"
          tags=(--tag "$image:$VERSION$SUFFIX")
          if [[ "$PRERELEASE" == false ]]; then
            tags+=(--tag "$image:$ALIAS")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$image:$VERSION$SUFFIX-amd64" "$image:$VERSION$SUFFIX-arm64"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$(docker buildx imagetools inspect "$image:$VERSION$SUFFIX" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.manifest.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  package-android:
    name: Android arm64
    needs: setup
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      CARGO_NDK_PLATFORM: 26
      VERSION: ${{ needs.setup.outputs.version }}
      TCODE_BUILD_VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.tag }}

      - name: Install stable Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The legacy `tools` package (the action's default) no longer exists.
          packages: platform-tools

      - name: Install Android NDK and cargo-ndk
        run: |
          sdkmanager 'ndk;27.1.12297006'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked

      # Signing credentials are optional. With none of the four ANDROID_* secrets the
      # APK is signed with Gradle's debug keystore, which is generated per runner, so
      # it does not install over a previous build; with all four it is signed with the
      # fixed release key; a partial set fails this step naming the missing secrets.
      # Create the key once and keep it (a lost key means users must uninstall):
      #   keytool -genkeypair -v -keystore tcode-release.jks -alias tcode \
      #     -keyalg RSA -keysize 4096 -validity 10000
      #   ANDROID_KEYSTORE          base64 of tcode-release.jks (`base64 -i tcode-release.jks`)
      #   ANDROID_KEYSTORE_PASSWORD keystore password chosen above
      #   ANDROID_KEY_ALIAS         the alias chosen above (`tcode`)
      #   ANDROID_KEY_PASSWORD      key password chosen above
      # Verify a signed release locally with
      #   apksigner verify --print-certs tcode-*-android-arm64.apk
      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for var in ANDROID_KEYSTORE ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [[ -n "${!var:-}" ]] || missing+=("$var")
          done
          if (( ${#missing[@]} == 4 )); then
            echo "::notice::Android signing secrets not configured — signing with the debug keystore."
            exit 0
          elif (( ${#missing[@]} > 0 )); then
            echo "::error::Android signing partially configured; missing: ${missing[*]}" >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/tcode-release.jks"
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$keystore"
          {
            echo "TCODE_ANDROID_KEYSTORE=$keystore"
            echo "TCODE_ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "TCODE_ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "TCODE_ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # Release profile, stripped native library, R8; signed by the step above.
      - name: Build Android release APK
        run: crates/android/host/build.sh --release

      - name: Package Android APK
        run: |
          mkdir -p dist
          cp crates/android/host/app/build/outputs/apk/release/app-release.apk \
            "dist/tcode-${VERSION}-android-arm64.apk"
          ls -lh dist

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: package-android-arm64
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

  finalize:
    name: Publish release checksums
    needs: [setup, package, package-headless, package-traverse, package-android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.tag }}

      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Include Compose deployment template
        run: cp docker-compose.yml dist/docker-compose.yml

      - name: Show release files
        run: ls -lh dist

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS.txt

      - name: Upload packages and aggregate checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.setup.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE_TAG" dist/* \
            --repo "$REPOSITORY" \
            --clobber

      - name: Show published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.setup.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json assets --jq '.assets[].name'

  publish-aur:
    name: Publish to AUR
    needs: [setup, finalize]
    if: needs.setup.outputs.prerelease == 'false' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    env:
      GIT_SSH_COMMAND: ssh -i ~/.ssh/aur -o StrictHostKeyChecking=accept-new
    steps:
      - name: Initialize pacman and install dependencies
        run: |
          pacman-key --init && pacman-key --populate
          pacman -Syu --noconfirm --needed git openssh

      - name: Download Linux packages
        uses: actions/download-artifact@v8
        with:
          pattern: package-linux-*
          path: dist
          merge-multiple: true

      - name: Calculate SHA256 checksums
        id: checksums
        working-directory: dist
        run: |
          sha256_x64=$(sha256sum "tcode-${{ needs.setup.outputs.version }}-linux-x64.tar.gz" | cut -d' ' -f1)
          sha256_arm64=$(sha256sum "tcode-${{ needs.setup.outputs.version }}-linux-arm64.tar.gz" | cut -d' ' -f1)
          echo "x64=$sha256_x64" >> "$GITHUB_OUTPUT"
          echo "arm64=$sha256_arm64" >> "$GITHUB_OUTPUT"

      - name: Install SSH key for AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur

      - name: Clone AUR repository
        run: git clone aur@aur.archlinux.org:tcode-bin.git aur-repo

      - name: Update pkgver and checksums
        working-directory: aur-repo
        run: |
          sed -i "s/^pkgver=.*/pkgver=${{ needs.setup.outputs.version }}/" PKGBUILD
          sed -i "s/^sha256sums_x86_64=('.*')/sha256sums_x86_64=('${{ steps.checksums.outputs.x64 }}')/" PKGBUILD
          sed -i "s/^sha256sums_aarch64=('.*')/sha256sums_aarch64=('${{ steps.checksums.outputs.arm64 }}')/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

      - name: Generate .SRCINFO
        working-directory: aur-repo
        run: |
          useradd -m builder
          chown -R builder:builder .
          runuser -u builder -- makepkg --printsrcinfo > .SRCINFO

      - name: Commit and push to AUR
        working-directory: aur-repo
        run: |
          git config --global --add safe.directory "$PWD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes. AUR package is already up to date."
            exit 0
          fi
          git add PKGBUILD .SRCINFO
          git commit -m "upstream v${{ needs.setup.outputs.version }}"
          git push origin master
          echo "::notice::Published tcode-bin v${{ needs.setup.outputs.version }} to AUR"
