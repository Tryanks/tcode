services:
  tcode:
    # Pin TCODE_VERSION in .env to a release; use <version>-slim
    # (or slim) to download only selected CLIs on first start into the data volume.
    image: ghcr.io/tryanks/tcode-headless:${TCODE_VERSION:-latest}
    restart: unless-stopped
    environment:
      # Run `id -u` / `id -g` on the host. Agents write projects as these IDs.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TCODE_PASSWORD: ${TCODE_PASSWORD:?Set TCODE_PASSWORD in .env}
      # Unset means all six; an explicitly empty value means no native providers.
      TCODE_AGENTS: ${TCODE_AGENTS-claude,codex,pi,opencode,cursor,grok}
      # Optional API keys, or log in from a Tcode terminal pane (docs/docker.md).
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # OPENAI_API_KEY: ${OPENAI_API_KEY}
      # CURSOR_API_KEY: ${CURSOR_API_KEY}
      # XAI_API_KEY: ${XAI_API_KEY}
      # With the optional socket mount, set this to `stat -c %g /var/run/docker.sock`:
      # DOCKER_GID: ${DOCKER_GID:?Set DOCKER_GID in .env}
    command: [serve, --name, homelab, --browser-listen, "0.0.0.0:47420"]
    ports:
      - "47420:47420/tcp" # Password-protected browser app: http://<host>:47420/
      - "47420:47420/udp" # Native clients: Traverse and direct LAN connections
    # For Linux LAN/mDNS discovery, replace ports above with host networking:
    # network_mode: host
    volumes:
      # Contains traverse.json (machine key + pairings), threads and CLI logins.
      # Keep and back up this volume; `down -v` destroys the machine identity.
      - tcode-data:/data
      # Add projects in Tcode using paths under /projects.
      - ${TCODE_PROJECTS:-./projects}:/projects
      # Optional sibling containers, NOT Docker-in-Docker. Host-root-equivalent:
      # - /var/run/docker.sock:/var/run/docker.sock
      # Install a Docker CLI in a derived image; see docs/docker.md.

volumes:
  tcode-data:
