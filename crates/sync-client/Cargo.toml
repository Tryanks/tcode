[package]
name = "sync-client"
version = "0.1.0"
edition = "2024"

[dependencies]
sync-protocol = { path = "../sync-protocol" }
# Types only. This crate runs on phones and in browsers, where there are no
# provider processes to spawn — that is the entire reason it exists.
agent = { path = "../agent", default-features = false }
tcode-core = { path = "../core" }
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-util = "0.3"
serde_json = "1"
tcode-services = { path = "../services" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = "0.28"
