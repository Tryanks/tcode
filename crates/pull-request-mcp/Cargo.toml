[package]
name = "pull-request-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "3.4", features = ["macros", "schemars", "server", "transport-streamable-http-server"] }
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
mcp-host = { path = "../mcp-host" }
tcode-core = { path = "../core" }
