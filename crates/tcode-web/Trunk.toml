[build]
dist = "dist"

[serve]
addresses = ["127.0.0.1"]
port = 8080
open = false

# WebAssembly threads require SharedArrayBuffer, which browsers expose only in
# a cross-origin-isolated page.
headers = { "Cross-Origin-Embedder-Policy" = "require-corp", "Cross-Origin-Opener-Policy" = "same-origin" }
