[package]
name = "gtk-dlopen"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Loads GTK 3, WebKitGTK 4.1 and the libraries they bind when asked, instead of when the process starts."

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[build-dependencies]
object = { version = "0.37", default-features = false, features = ["read_core", "elf", "std"] }
pkg-config = "0.3"
