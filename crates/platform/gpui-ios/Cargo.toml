[package]
name = "gpui-ios"
version = "0.3.3"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "iOS platform backend for gpui-pre (Metal via gpui-pre-wgpu)"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.3", default-features = false }
gpui_wgpu = { package = "gpui-pre-wgpu", version = "=0.3.3" }
anyhow = "1"
log = "0.4"
parking_lot = "0.12"
futures = "0.3"
raw-window-handle = "0.6"
smallvec = "1"

[target.'cfg(target_os = "ios")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
core-text = "21"
font-kit = { package = "zed-font-kit", version = "0.14.1-zed" }
libc = "0.2"
pathfinder_geometry = "0.5"
uuid = { version = "1", features = ["v5"] }
