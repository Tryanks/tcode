[package]
name = "gpui-ios"
version = "0.3.7"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "iOS platform backend for gpui-fast (Metal via gpui_wgpu)"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8", default-features = false }
gpui_wgpu = { git = "https://github.com/longbridge/gpui-fast" }
anyhow = "1"
log = "0.4"
parking_lot = "0.12"
futures = "0.3"
raw-window-handle = "0.6"
smallvec = "1"

[target.'cfg(target_os = "ios")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
core-text = "21"
font-kit = { package = "zed-font-kit", version = "0.14.1-zed" }
# libc 0.2.190 gates AF_SYS_CONTROL, SYSPROTO_* and the _dyld_* image functions to
# macOS, but backtrace 0.3.76 (via gpui) still calls them on every Apple target, so
# the iOS check fails. Held below 0.2.190 until backtrace gates them too (#668).
libc = ">=0.2, <0.2.190"
pathfinder_geometry = "0.5"
uuid = { version = "1", features = ["v5"] }
