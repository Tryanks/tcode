[package]
name = "tcode-client"
version = "0.1.0"
edition = "2024"

[features]
voice = ["dep:block2", "dep:objc2", "dep:objc2-foundation", "dep:objc2-av-foundation", "dep:objc2-avf-audio", "dep:objc2-speech", "dep:windows", "dep:cpal"]

[dependencies]
tcode-protocol = { path = "../protocol", default-features = false }
async-channel = "2"
base64 = "0.23"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
futures-lite = "2"
web-time = "1"
uuid = { version = "1", features = ["v4", "js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-io = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
smol = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSError", "NSLocale", "NSString"], optional = true }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"], optional = true }
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "block2", "AVAudioEngine", "AVAudioTime", "AVAudioNode", "AVAudioIONode", "AVAudioBuffer", "AVAudioFormat", "AVAudioTypes"], optional = true }
objc2-speech = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-avf-audio", "SFSpeechRecognitionMetadata", "SFSpeechRecognitionRequest", "SFSpeechRecognitionResult", "SFSpeechRecognitionTask", "SFSpeechRecognizer", "SFTranscription"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
cpal = { version = "0.18.2", optional = true }
windows = { version = "0.58", features = ["Foundation_Collections", "Globalization", "Media_SpeechRecognition", "Win32_Foundation"], optional = true }
