[package]
name = "sync-host"
version = "0.1.0"
edition = "2024"

[dependencies]
sync-protocol = { path = "../sync-protocol" }
# Types only: this crate must not depend on GPUI or on the provider adapters.
# Phase 1.5 of docs/multiplatform-plan.md reuses it verbatim for a headless
# `tcode-server` by swapping the binary's `main`, which only works if nothing
# here reaches for a UI or a child process.
agent = { path = "../agent", default-features = false }
tcode-core = { path = "../core" }
tcode-services = { path = "../services" }
async-channel = "2"
log = "0.4"

[dev-dependencies]
serde_json = "1"
