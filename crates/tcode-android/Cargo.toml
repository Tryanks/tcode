[package]
name = "tcode-android"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
# `cdylib` is what Gradle packages into the APK and what `System.loadLibrary`
# opens. `rlib` keeps the crate testable from the host workspace.
crate-type = ["cdylib", "rlib"]

# Android-only: the JNI bridge and the platform backend it drives cannot exist
# on a host target, and the workspace build must stay green on desktop.
[target.'cfg(target_os = "android")'.dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-android = { path = "../gpui-android" }
anyhow = "1"
jni = "0.21"
log = "0.4"
android_logger = "0.15"
ndk = "0.9"
raw-window-handle = "0.6"
