[package]
name = "tcode-remote"
version = "0.1.0"
edition = "2024"

[dependencies]
tcode-protocol = { path = "../protocol" }
async-channel = "2"
async-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
base64 = "0.23"
futures-lite = "2"
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "0.3"
if-addrs = "0.13"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
smol = "2"
socket2 = "0.6"
tungstenite = "0.27"
ureq = { version = "2", default-features = false, features = [] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
