[package]
name = "tcode-remote"
version = "0.1.0"
edition = "2024"

[features]
default = ["server", "client", "fast-apple-datapath"]
# iroh's Apple UDP fast path. Off for iOS, which builds tcode-remote without
# default features.
fast-apple-datapath = ["tcode-traverse/fast-apple-datapath"]
server = [
    "dep:tcode-protocol",
    "dep:base64",
    "dep:getrandom",
    "dep:sha1",
    "dep:uuid",
    "dep:pbkdf2",
    "dep:sha2",
    "dep:async-tungstenite",
    "dep:tungstenite",
    "dep:futures-util",
]
client = ["dep:tcode-protocol", "dep:dirs", "dep:url"]

[dependencies]
tcode-client = { path = "../client" }
tcode-protocol = { path = "../protocol", optional = true, default-features = false }
tcode-traverse = { path = "../traverse", default-features = false }
async-channel = "2"
dirs = { version = "7", optional = true }
async-tungstenite = { version = "0.35", default-features = false, features = ["handshake"], optional = true }
base64 = { version = "0.23", optional = true }
futures-lite = "2"
futures-util = { version = "0.3", features = ["sink", "io"], optional = true }
getrandom = { version = "0.4", optional = true }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.11", optional = true }
sha2 = { version = "0.11", optional = true }
pbkdf2 = { version = "0.13", optional = true }
smol = "2"
tungstenite = { version = "0.30", optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }
url = { version = "2", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
system-configuration-sys = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_System_SystemInformation",
] }

[dev-dependencies]
tcode-runtime = { path = "../runtime", features = ["test-support"] }
tcode-services = { path = "../services" }
