[package]
name = "tcode-remote"
version = "0.1.0"
edition = "2024"

[features]
default = ["server", "client"]
server = [
    "dep:tcode-protocol",
    "dep:base64",
    "dep:getrandom",
    "dep:if-addrs",
    "dep:sha1",
    "dep:uuid",
    "dep:pbkdf2",
]
client = ["dep:tcode-protocol", "dep:dirs"]

[dependencies]
tcode-client = { path = "../client" }
tcode-protocol = { path = "../protocol", optional = true, default-features = false }
async-channel = "2"
dirs = { version = "6", optional = true }
async-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
base64 = { version = "0.23", optional = true }
futures-lite = "2"
futures-util = { version = "0.3", features = ["sink"] }
getrandom = { version = "0.3", optional = true }
if-addrs = { version = "0.13", optional = true }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.10", optional = true }
sha2 = "0.10"
pbkdf2 = { version = "0.12", optional = true }
smol = "2"
tungstenite = "0.27"
uuid = { version = "1", features = ["v4", "serde"], optional = true }

rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
mdns-sd = "0.20"
webpki-roots = "1"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
system-configuration-sys = "0.6"

[dev-dependencies]
tcode-runtime = { path = "../runtime", features = ["test-support"] }
tcode-services = { path = "../services" }
