[package]
name = "tcode-core"
version = "0.1.0"
edition = "2024"

[features]
default = ["process"]
process = ["agent/process", "uuid/v4"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
agent = { path = "../agent", default-features = false }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", default-features = false, features = ["serde"] }
