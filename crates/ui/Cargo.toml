[package]
name = "tcode-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
agent = { path = "../agent" }
tcode-core = { path = "../core" }
tcode-protocol = { path = "../protocol" }
tcode-runtime = { path = "../runtime" }
tcode-services = { path = "../services" }
term = { path = "../term" }
preview-mcp = { path = "../preview-mcp" }
computer-use-mcp = { path = "../computer-use-mcp" }
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "c1acb9f3854238da9543af817453726a0efbadb0" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "c1acb9f3854238da9543af817453726a0efbadb0" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
base64 = "0.23"
chrono = "0.4"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
rushdown = "0.18.0"
rust-i18n = "4"
sys-locale = "0.3"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }
imara-diff = "0.2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
gpui-wry = { git = "https://github.com/longbridge/gpui-component", rev = "c1acb9f3854238da9543af817453726a0efbadb0" }
wry = { version = "0.53.3", package = "lb-wry" }
raw-window-handle = { version = "0.6", features = ["std"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", features = ["NSGraphicsContext", "NSImage", "NSImageRep", "NSPasteboard", "objc2-core-graphics"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFData", "CFString"] }
objc2-foundation = { version = "0.3.2", features = ["NSError"] }
objc2-image-io = { version = "0.3.2", features = ["CGImageDestination"] }
objc2-web-kit = { version = "0.3.2", features = ["WKSnapshotConfiguration", "WKWebView"] }

[dev-dependencies]
criterion = "0.8"
gpui = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
tcode-runtime = { path = "../runtime", features = ["test-support"] }
# dump-create is only needed by examples/sanitize_syntaxes.rs and the syntax-set
# regression test; the shipped binary keeps the lean dependency feature set.
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy", "dump-load", "dump-create"] }

[[bench]]
name = "markdown_perf"
harness = false
