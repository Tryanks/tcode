[package]
name = "tcode-services"
version = "0.1.0"
edition = "2024"

[dependencies]
agent = { path = "../agent" }
tcode-core = { path = "../core" }
tcode-protocol = { path = "../protocol" }
base64 = "0.23"
chrono = "0.4"
dirs = "7"
flate2 = "1"
futures-lite = "2"
ignore = "0.4"
log = "0.4"
memchr = "2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
jpeg-decoder = { version = "0.3.2", default-features = false }
imara-diff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
smol = "2"
tar = "0.4"
# Default features add a global allocator (mimalloc) and full-text search
# (tantivy, zstd); the store needs neither.
turso = { version = "=0.8.3", default-features = false }
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zstd = { version = "0.13", default-features = false, features = ["zdict_builder"] }
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
] }
