[package]
name = "tcode-services"
version = "0.1.0"
edition = "2024"

[dependencies]
agent = { path = "../agent" }
tcode-core = { path = "../core" }
tcode-protocol = { path = "../protocol" }
base64 = "0.23"
chrono = "0.4"
dirs = "6"
flate2 = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
tar = "0.4"
thiserror = "2"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }
