[package]
name = "sync-protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
# Types only. The adapters that spawn provider processes live behind agent's
# `local` feature, which this crate must not enable: it has to build for
# wasm32-unknown-unknown, where there are no processes to spawn.
agent = { path = "../agent", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
