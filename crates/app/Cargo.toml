[package]
name = "tcode"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tcode"
path = "src/main.rs"

[package.metadata.bundle]
name = "Tcode"
identifier = "com.tryanks.tcode"
icon = ["../../assets/icons/app/tcode.icns"]

[dependencies]
tcode-services = { path = "../services" }
tcode-protocol = { path = "../protocol" }
tcode-runtime = { path = "../runtime" }
tcode-ui = { path = "../ui" }
preview-mcp = { path = "../preview-mcp" }
orchestrate-mcp = { path = "../orchestrate-mcp" }
computer-use-mcp = { path = "../computer-use-mcp" }
mcp-host = { path = "../mcp-host" }
gpui = { package = "gpui-pre", version = "0.3.1" }
gpui_platform = { package = "gpui-pre-platform", version = "0.3.1", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-base = "0.6.0"
env_logger = "0.11"
log = "0.4"

[build-dependencies]
embed-resource = "3.0.11"
