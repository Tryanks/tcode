[package]
name = "tcode"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tcode"
path = "src/main.rs"

[package.metadata.bundle]
name = "Tcode"
identifier = "com.tryanks.tcode"
icon = ["../../assets/icons/app/tcode.icns"]

[dependencies]
tcode-client = { path = "../client" }
tcode-services = { path = "../services" }
tcode-protocol = { path = "../protocol" }
tcode-traverse = { path = "../traverse", features = ["native"] }
tcode-runtime = { path = "../runtime" }
tcode-ui = { path = "../ui" }
computer-use-mcp = { path = "../computer-use-mcp" }
gpui = { package = "gpui-fast", version = "0.1.13", default-features = false }
gpui_platform = { package = "gpui-fast-platform", version = "0.1.13", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
env_logger = "0.11"
log = "0.4"
smol = "2"
async-channel = "2"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSDictionary", "NSError", "NSObject", "NSString"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger", "UNUserNotificationCenter", "bitflags"] }

[build-dependencies]
embed-resource = "3.0.11"
