[package]
name = "computer-use-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "3.0", features = [
    "macros",
    "schemars",
    "server",
    "transport-streamable-http-server",
] }
tokio = { version = "1", features = [
    "time",
    "sync",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
log = "0.4"
mcp-host = { path = "../mcp-host" }
base64 = "0.23"
tcode-services = { path = "../services" }
tcode-core = { path = "../core" }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = { version = "0.25", features = ["highsierra"] }
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "alloc",
    "NSArray",
    "NSData",
    "NSDictionary",
] }
objc2-vision = { version = "0.3.2", default-features = false, features = [
    "objc2-core-foundation",
    "VNObservation",
    "VNRecognizeTextRequest",
    "VNRequest",
    "VNRequestHandler",
] }
