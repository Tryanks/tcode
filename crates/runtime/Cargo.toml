[package]
name = "tcode-runtime"
version = "0.1.0"
edition = "2024"

[features]
test-support = []

[dependencies]
agent = { path = "../agent" }
async-channel = "2"
base64 = "0.23"
computer-use-mcp = { path = "../computer-use-mcp" }
log = "0.4"
orchestrate-mcp = { path = "../orchestrate-mcp" }
preview-mcp = { path = "../preview-mcp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
tcode-core = { path = "../core" }
tcode-protocol = { path = "../protocol" }
tcode-services = { path = "../services" }
term = { path = "../term" }
uuid = { version = "1", features = ["v4"] }
