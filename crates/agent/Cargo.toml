[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[features]
default = ["process"]
process = [
    "dep:agent-client-protocol",
    "dep:chrono",
    "dep:dirs",
    "dep:toml",
    "dep:turso",
    "dep:sha2",
    "dep:smol",
    "dep:ureq",
    "dep:uuid",
    "dep:windows",
    "dep:libc",
]

[dependencies]
agent-client-protocol = { version = "5.3", optional = true, features = [
    "unstable_end_turn_token_usage",
] }
log = "0.4"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
dirs = { version = "7", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
sha2 = { version = "0.11", optional = true }
smol = { version = "2", optional = true }
toml = { version = "1.1", optional = true }
# The version the store in `tcode-services` pins: one Turso in the build.
turso = { version = "=0.8.3", default-features = false, optional = true }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
], optional = true }

[dev-dependencies]
env_logger = "0.11"

[[example]]
name = "probe"
required-features = ["process"]

[[test]]
name = "acp_settings"
required-features = ["process"]
harness = false

[[test]]
name = "acp_wire"
required-features = ["process"]
harness = false
