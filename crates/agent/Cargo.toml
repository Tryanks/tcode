[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[features]
default = ["process"]
process = [
    "dep:agent-client-protocol",
    "dep:base64",
    "dep:smol",
    "dep:ureq",
    "dep:uuid",
]

[dependencies]
agent-client-protocol = { version = "2.0", optional = true, features = [
    "unstable_auth_methods",
    "unstable_end_turn_token_usage",
] }
log = "0.4"
base64 = { version = "0.23", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = { version = "2", optional = true }
ureq = { version = "2", default-features = false, features = ["tls", "gzip"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[dev-dependencies]
env_logger = "0.11"
toml = "1.1"

[[example]]
name = "probe"
required-features = ["process"]
