[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[dependencies]
agent-client-protocol = { version = "2.0", features = [
    "unstable_auth_methods",
    "unstable_end_turn_token_usage",
] }
log = "0.4"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
env_logger = "0.11"
toml = "1.1"
