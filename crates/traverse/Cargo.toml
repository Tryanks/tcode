[package]
name = "tcode-traverse"
version = "0.1.0"
edition = "2024"

[features]
default = ["fast-apple-datapath"]
# iroh's Apple-specific UDP fast path; iOS builds disable it.
fast-apple-datapath = ["iroh/fast-apple-datapath"]
# The native client host and the Preview adapters a native client shows a
# machine's pages through.
native = [
    "dep:dirs",
    "dep:libc",
    "dep:core-foundation",
    "dep:system-configuration-sys",
    "dep:windows",
]
# The browser listener: static bundle, password login and `/ws` into the
# same HostMux. Headless only.
browser = [
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:base64",
    "dep:pbkdf2",
    "dep:sha2",
    "dep:uuid",
]

[dependencies]
tcode-client = { path = "../client" }
tcode-protocol = { path = "../protocol", default-features = false }
async-channel = "2"
base64 = { version = "0.23", optional = true }
dirs = { version = "7", optional = true }
futures-lite = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink"], optional = true }
getrandom = "0.4"
iroh = { version = "1.2", default-features = false, features = ["metrics", "portmapper", "tls-ring"] }
log = "0.4"
pbkdf2 = { version = "0.13", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "net", "sync"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"], optional = true }
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { version = "0.9", optional = true }
system-configuration-sys = { version = "0.6", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_System_SystemInformation",
], optional = true }

[dev-dependencies]
env_logger = "0.11"
# Tests cover every layer, whichever features the consumer picks.
tcode-traverse = { path = ".", features = ["browser", "native"] }
