[package]
name = "tcode-traverse"
version = "0.1.0"
edition = "2024"

[features]
default = ["fast-apple-datapath"]
# iroh's Apple-specific UDP fast path; iOS builds disable it.
fast-apple-datapath = ["iroh/fast-apple-datapath"]

[dependencies]
tcode-client = { path = "../client" }
tcode-protocol = { path = "../protocol", default-features = false }
async-channel = "2"
futures-lite = "2"
getrandom = "0.4"
iroh = { version = "1.2", default-features = false, features = ["metrics", "portmapper", "tls-ring"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "net", "sync"] }
url = "2"

[dev-dependencies]
env_logger = "0.11"
