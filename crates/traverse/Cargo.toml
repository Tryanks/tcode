[package]
name = "tcode-traverse"
version = "0.1.0"
edition = "2024"

[features]
default = ["fast-apple-datapath"]
# iroh's Apple-specific UDP fast path; iOS builds disable it.
fast-apple-datapath = ["iroh/fast-apple-datapath"]
# The native client host and the Preview adapters a native client shows a
# machine's pages through.
native = [
    "dep:libc",
    "dep:core-foundation",
    "dep:system-configuration-sys",
    "dep:windows",
]
# The browser listener: static bundle, password login and `/ws` into the
# same HostMux. Headless only.
browser = [
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:base64",
    "dep:pbkdf2",
    "dep:sha2",
]
# The SSH server a machine runs on each admitted `ssh` stream, for an
# editor's own remote development. Hosts only.
ssh = [
    "dep:russh",
    "dep:russh-sftp",
    "dep:tcode-services",
    "dep:term",
    "dep:libc",
    "tokio/process",
    "tokio/fs",
]

[dependencies]
tcode-client = { path = "../client" }
tcode-protocol = { path = "../protocol", default-features = false }
async-channel = "2"
flate2 = "1"
base64 = { version = "0.23", optional = true }
futures-lite = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink"], optional = true }
getrandom = "0.4"
iroh = { version = "1.2", default-features = false, features = ["metrics", "portmapper", "tls-ring", "unstable-net-report"] }
log = "0.4"
mdns-sd = { version = "0.21", default-features = false, features = ["logging"] }
pbkdf2 = { version = "0.13", optional = true }
russh = { version = "0.65", default-features = false, features = ["ring"], optional = true }
# 3.x needs a newer wasm-bindgen-futures than the one crates/web pins.
russh-sftp = { version = "2.4", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "net", "sync"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"], optional = true }
tcode-services = { path = "../services", optional = true }
term = { path = "../term", optional = true }
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { version = "0.9", optional = true }
system-configuration-sys = { version = "0.6", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_System_SystemInformation",
], optional = true }

[dev-dependencies]
tcode-runtime = { path = "../runtime" }
tcode-services = { path = "../services" }
tcode-core = { path = "../core" }
agent = { path = "../agent" }
base64 = "0.23"
env_logger = "0.11"
# Tests cover every layer, whichever features the consumer picks.
tcode-traverse = { path = ".", features = ["browser", "native", "ssh"] }
