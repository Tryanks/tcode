[package]
name = "tcode-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tcode-server"
path = "src/main.rs"

[dependencies]
sync-host = { path = "../sync-host" }
sync-protocol = { path = "../sync-protocol" }
tcode-services = { path = "../services" }
log = "0.4"
env_logger = "0.11"
async-channel = "2"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
tokio = { version = "1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
