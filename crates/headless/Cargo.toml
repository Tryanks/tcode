[package]
name = "tcode-headless"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tcode-headless"
path = "src/main.rs"

[features]
default = []
web = []

[dependencies]
env_logger = "0.11"
mcp-host = { path = "../mcp-host" }
orchestrate-mcp = { path = "../orchestrate-mcp" }
preview-mcp = { path = "../preview-mcp" }
qrcode = { version = "0.14", default-features = false }
serde_json = "1"
tcode-protocol = { path = "../protocol" }
tcode-remote = { path = "../remote" }
tcode-runtime = { path = "../runtime" }
tcode-services = { path = "../services" }
