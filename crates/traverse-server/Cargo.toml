[package]
name = "tcode-traverse-server"
version = "0.1.0"
edition = "2024"
description = "Self-hostable Traverse instance: iroh relay with QUIC address discovery, pkarr store and manifest"

[[bin]]
name = "tcode-traverse"
path = "src/main.rs"

[dependencies]
axum = "0.8"
chrono = "0.4"
futures-lite = "2"
http = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
ipnet = { version = "2", features = ["serde"] }
iroh-base = { version = "1.2", default-features = false, features = ["key"] }
iroh-dns = "1.3"
iroh-metrics = { version = "1", features = ["service"] }
iroh-relay = { version = "1.2", default-features = false, features = ["server"] }
redb = "4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-rustls-acme = "0.9"
toml = "1.1"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }

[dev-dependencies]
iroh = { version = "1.2", default-features = false, features = ["tls-ring"] }
reqwest = { version = "0.13", default-features = false }
