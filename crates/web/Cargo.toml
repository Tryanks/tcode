[package]
name = "tcode-web"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
debug-exports = []

[target.'cfg(target_family = "wasm")'.dependencies]
gpui = { package = "gpui-fast", version = "0.1.10", default-features = false }
# The browser constructs its own platform (gpui::Application::with_platform)
# rather than enabling the web backend's multithreaded default.
gpui_web = { package = "gpui-fast-web", version = "0.1.10", default-features = false }
console_error_panic_hook = "0.1"
tcode-protocol = { path = "../protocol", default-features = false }
tcode-client = { path = "../client" }
tcode-ui = { path = "../ui", default-features = false }
async-channel = "2"
futures-lite = "2"
serde_json = "1"
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
js-sys = "=0.3.104"
web-sys = { version = "=0.3.104", features = [
    "Window", "Performance", "Document", "Element", "HtmlCanvasElement", "HtmlAnchorElement", "Node",
    "MutationObserver", "MutationObserverInit", "MutationRecord", "NodeList",
    "Location", "Navigator", "Storage", "WebSocket", "Event", "EventTarget", "MessageEvent",
    "Blob", "BlobPropertyBag", "Url",
    "AbortController", "AbortSignal", "Request", "RequestInit", "Response", "Headers",
    "ReadableStream", "ReadableStreamDefaultReader",
] }
