[workspace]
members = [
    "crates/agent",
    "crates/core",
    "crates/protocol",
    "crates/client",
    "crates/remote",
    "crates/headless",
    "crates/web",
    "crates/services",
    "crates/runtime",
    "crates/term",
    "crates/mcp-host",
    "crates/preview-mcp",
    "crates/orchestrate-mcp",
    "crates/computer-use-mcp",
    "crates/ui",
    "crates/voice",
    "crates/app",
    "crates/mobile",
    "crates/ios",
    "crates/android",
]
exclude = [
    "crates/platform/gpui-platform-shim",
    "crates/platform/gpui-ios",
    "crates/platform/gpui-android",
]
resolver = "3"
default-members = ["crates/app"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[patch.crates-io]
gpui-pre-platform = { path = "crates/platform/gpui-platform-shim" }
