[workspace]
members = [
    "crates/agent",
    "crates/core",
    "crates/protocol",
    "crates/client",
    "crates/traverse",
    "crates/traverse-server",
    "crates/headless",
    "crates/web",
    "crates/services",
    "crates/runtime",
    "crates/term",
    "crates/mcp-host",
    "crates/preview-mcp",
    "crates/pull-request-mcp",
    "crates/control-mcp",
    "crates/computer-use-mcp",
    "crates/ui",
    "crates/app",
    "crates/ios",
    "crates/platform/gpui-ios",
    "crates/platform/frame-pacing",
    "crates/platform/touch",
    "crates/platform/wayland-nest",
    "crates/platform/gtk-dlopen",
    "crates/android",
]
exclude = [
    "crates/platform/gpui-android",
]
resolver = "3"
default-members = ["crates/app"]

# opt-level 3 stays the shipping default on every platform, including the
# Android APK, although `s`/`z` produce a smaller library: `z` worsened tail
# frame pacing on a phone and neither was measured on markdown, highlighting or
# large conversation replay.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"

# ndk-stack needs an unstripped library with line information for crash reports.
[profile.android-release]
inherits = "release"
strip = false
debug = 1

# These dependencies do in a debug build the work the tests around them are
# about: decoding pictures past the picture budget, hashing a browser password
# at its real iteration count, training and using a compression dictionary,
# reading and writing the session store's database.
# Unoptimized they cost seconds a test; nothing here is stepped through.
[profile.dev.package]
image = { opt-level = 3 }
zune-jpeg = { opt-level = 3 }
jpeg-decoder = { opt-level = 3 }
png = { opt-level = 3 }
fdeflate = { opt-level = 3 }
miniz_oxide = { opt-level = 3 }
pbkdf2 = { opt-level = 3 }
hmac = { opt-level = 3 }
sha2 = { opt-level = 3 }
zstd = { opt-level = 3 }
zstd-safe = { opt-level = 3 }
zstd-sys = { opt-level = 3 }
turso_core = { opt-level = 3 }
turso_parser = { opt-level = 3 }
