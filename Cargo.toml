[workspace]
members = [
    "crates/agent",
    "crates/core",
    "crates/protocol",
    "crates/services",
    "crates/runtime",
    "crates/term",
    "crates/mcp-host",
    "crates/preview-mcp",
    "crates/orchestrate-mcp",
    "crates/computer-use-mcp",
    "crates/ui",
    "crates/app",
]
resolver = "3"
default-members = ["crates/app"]

# Debug FPS: gpui/taffy layout+paint are unusable at opt-level 0, and taffy's
# generics are instantiated inside gpui, so deps must be optimized wholesale.
# Workspace crates stay at opt-level 0 for debugging.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"
